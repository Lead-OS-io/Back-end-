[project]
name = "api-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.12.0",
    "httpx==0.27.0",
    "pyjwt==2.9.0",
    "redis==5.0.1",
    "lead-os-shared",
]

[dependency-groups]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "fakeredis==2.20.0",
]

[tool.uv.sources]
lead-os-shared = { path = "../../shared", editable = true }
