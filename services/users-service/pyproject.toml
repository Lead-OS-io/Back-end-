[project]
name = "users-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlmodel==0.0.14",
    "SQLAlchemy>=2.0,<2.1",
    "psycopg2-binary==2.9.11",
    "alembic==1.12.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.12.0",
    "redis==5.0.1",
    "httpx==0.27.0",
    "pyjwt==2.9.0",
    "google-api-python-client==2.108.0",
    "google-auth==2.23.4",
    "google-auth-oauthlib==1.1.0",
    "google-auth-httplib2==0.1.1",
    "googleapis-common-protos>=1.56.2",
    "protobuf>=3.19.5",
    "lead-os-shared",
]

[dependency-groups]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "fakeredis==2.20.0",
]

[tool.uv.sources]
lead-os-shared = { path = "../../shared", editable = true }
